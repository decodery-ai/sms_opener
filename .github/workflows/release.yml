name: Publish to RubyGems

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Run RSpec test suite
        run: bundle exec rspec

      - name: Build gem
        run: gem build sms_opener.gemspec

      - name: Configure RubyGems OIDC Trusted Publishing
        uses: rubygems/configure-rubygems-credentials@v1

      - name: Push gem to RubyGems.org
        run: gem push sms_opener-*.gem
